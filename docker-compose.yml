services:
  postgres:
    image: postgres:15-alpine
    container_name: cora-postgres
    restart: always
    environment:
      POSTGRES_USER: cora
      POSTGRES_PASSWORD: cora
      POSTGRES_DB: projeto_cora
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nest-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cora -d projeto_cora"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cora-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://cora:cora@postgres:5432/projeto_cora
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nest-network
    command: sh -c "npx prisma migrate deploy && node dist/src/main.js"

volumes:
  postgres_data:

networks:
  nest-network:
    driver: bridge
